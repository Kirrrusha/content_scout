name: content-scout

x-app-env-file: &app-env-file
  - ${CONTENT_SCOUT_ENV_FILE:-.env}

x-app-user: &app-user ${APP_UID:-10001}:${APP_GID:-10001}

services:
  volume-permissions:
    image: alpine:3.22
    command:
      - sh
      - -c
      - chown -R "${APP_UID:-10001}:${APP_GID:-10001}" /data/logs /data/tdlib /data/exports
    restart: "no"
    volumes:
      - tdlib_data:/data/tdlib
      - exports:/data/exports
      - logs:/data/logs

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telegram_summary}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-telegram_summary}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    image: ${CLOUDRU_REGISTRY:?CLOUDRU_REGISTRY is required}/content_scout-migrate:${IMAGE_TAG:?IMAGE_TAG is required}
    user: *app-user
    env_file: *app-env-file
    depends_on:
      volume-permissions:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command: ["-direction", "up", "-dir", "migrations"]
    restart: "no"
    volumes:
      - logs:/data/logs

  api:
    image: ${CLOUDRU_REGISTRY:?CLOUDRU_REGISTRY is required}/content_scout-api:${IMAGE_TAG:?IMAGE_TAG is required}
    user: *app-user
    env_file: *app-env-file
    depends_on:
      volume-permissions:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    volumes:
      - tdlib_data:/data/tdlib
      - exports:/data/exports
      - logs:/data/logs

  bot:
    image: ${CLOUDRU_REGISTRY:?CLOUDRU_REGISTRY is required}/content_scout-bot:${IMAGE_TAG:?IMAGE_TAG is required}
    user: *app-user
    env_file: *app-env-file
    environment:
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://api:8080}
    depends_on:
      volume-permissions:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - exports:/data/exports
      - logs:/data/logs

  tdlib-worker:
    image: ${CLOUDRU_REGISTRY:?CLOUDRU_REGISTRY is required}/content_scout-tdlib-worker:${IMAGE_TAG:?IMAGE_TAG is required}
    user: *app-user
    env_file: *app-env-file
    depends_on:
      volume-permissions:
        condition: service_completed_successfully
    restart: unless-stopped
    volumes:
      - tdlib_data:/data/tdlib
      - logs:/data/logs

  summary-worker:
    image: ${CLOUDRU_REGISTRY:?CLOUDRU_REGISTRY is required}/content_scout-summary-worker:${IMAGE_TAG:?IMAGE_TAG is required}
    user: *app-user
    env_file: *app-env-file
    environment:
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://api:8080}
    depends_on:
      volume-permissions:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - exports:/data/exports
      - logs:/data/logs

volumes:
  postgres_data:
  tdlib_data:
  exports:
  logs:

# The SOCKS tunnel to the proxy VM is bound to this network's gateway address on
# the host, so the subnet must stay stable across network recreation. Changing it
# requires updating TELEGRAM_PROXY_URL in Cloud.ru Secret Management as well.
networks:
  default:
    ipam:
      config:
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1
